name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.7.0.2"
      - name: Verify conversion toolchain
        run: |
          pandoc --version
          test "$(pandoc --version | sed -n '1s/^pandoc //p')" = "3.7.0.2"
      - name: Install and verify PDF rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          command -v pdftoppm
          pdftoppm -v
      - name: Install deterministic test dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Compile and run unit tests
        run: make check
